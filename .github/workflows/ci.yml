name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking — hay deuda técnica preexistente)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  backend-tests:
    name: Backend — integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: senoriales_test
          POSTGRES_PASSWORD: senoriales_test
          POSTGRES_DB: senoriales_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U senoriales_test -d senoriales_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # .env.test está gitignored, así que no existe tras el checkout. Lo
      # generamos con la DATABASE_URL del servicio postgres (puerto 5433) para
      # que tanto `prisma generate` (que carga prisma.config.ts y exige la var)
      # como `npm test` (dotenv -e .env.test) la encuentren.
      - name: Create .env.test for CI
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          APP_URL=http://localhost:3001
          CORS_ORIGIN=*
          DATABASE_URL=postgresql://senoriales_test:senoriales_test@localhost:5433/senoriales_test
          JWT_SECRET=test-secret-do-not-use-in-production-0123456789
          ELEVENLABS_API_KEY=
          ELEVENLABS_AGENT_ID=
          OPENAI_API_KEY=
          WHAPI_TOKEN=
          RESEND_API_KEY=
          EOF

      - name: Generate Prisma client
        run: npx dotenv -e .env.test -- prisma generate

      - name: Run test suite
        run: npm test
