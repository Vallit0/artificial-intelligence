# =============================================================================
# PRODUCCIÓN — capa_02 (4 vCPU / 8 GiB, Ubuntu 24.04, caja DEDICADA a Señoriales).
#   IP pública 101.44.189.13 · IP privada 10.4.6.4 · dominio centro-de-negocios.org
#
#   internet → nginx (443, TLS) → app1, app2 (least_conn)
#                                      │
#                                      └→ db (Postgres 15, interno)
#   migrate (one-shot) → prisma migrate deploy + seed idempotente
#   promtail           → Loki en capa_01 (10.4.6.20:3100)
#
# Afinado para una caja de 8 GiB: 2 réplicas de app (Node es 1 hilo/proceso; 2
# usan 2 cores y dejan 2 para Postgres + nginx + SO). SIN PgBouncer (con 2
# réplicas y connection_limit=20 el tope es 40 conexiones < max_connections=100;
# Prisma ya acota el pool). SIN worker de crons (no hay jobs tras remover LTI).
# La consolidación a capa_01 (4 réplicas + PgBouncer + nginx del host) vive en
# docker-compose.capa01.yml para una migración futura.
#
# Levantar:  docker compose -f docker-compose.prod.yml up -d --build
# Requiere ./server/.env con POSTGRES_PASSWORD, JWT_SECRET, ELEVENLABS_*, etc.,
# y los certs TLS en ./nginx/ssl/{fullchain,privkey}.pem.
# =============================================================================

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: senoriales-app:latest
  env_file:
    - ./server/.env
  environment:
    NODE_ENV: production
    PORT: "3000"
    # Sin PgBouncer: Prisma conecta directo a Postgres. connection_limit=20 por
    # réplica → 40 conexiones máx con 2 réplicas, holgado bajo max_connections=100.
    DATABASE_URL: "postgresql://senoriales:${POSTGRES_PASSWORD}@db:5432/senoriales?connection_limit=20&pool_timeout=30"
    CORS_ORIGIN: "https://centro-de-negocios.org,https://www.centro-de-negocios.org"
    JWT_SECRET: "${JWT_SECRET}"
    RUN_CRONS: "false"
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  networks:
    - senoriales-network
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        memory: 768M

services:
  # Migraciones + seed (one-shot). Corre antes de levantar las réplicas.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: senoriales-app:latest
    command: sh -c "npx prisma migrate deploy && tsx prisma/seed.ts"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://senoriales:${POSTGRES_PASSWORD}@db:5432/senoriales"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - senoriales-network
    logging: *default-logging

  # Réplicas de app. No publican puertos al host: nginx las alcanza por la red
  # interna de Docker (app1:3000, app2:3000).
  app1:
    <<: *app-base
  app2:
    <<: *app-base

  # PostgreSQL 15 — afinado para caja DEDICADA de 8 GiB (ver infra/postgresql.capa02.conf).
  db:
    image: postgres:15-alpine
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: senoriales
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: senoriales
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgresql.capa02.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senoriales -d senoriales"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - senoriales-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 3G

  # nginx — termina TLS y balancea entre las 2 réplicas (ver nginx/nginx.prod.conf).
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped
    networks:
      - senoriales-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

  # Promtail — envía logs al Loki de capa_01 (10.4.6.20:3100).
  promtail:
    image: grafana/promtail:3.3.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.prod.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
    restart: unless-stopped
    networks:
      - senoriales-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  promtail_positions:

networks:
  senoriales-network:
    driver: bridge
