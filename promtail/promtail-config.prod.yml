# ============================================
# Promtail (PROD) — envía logs al Loki que YA corre en capa_01 (10.4.6.20:3100).
# ============================================
#
# Arquitectura Go-Live: Señoriales se consolida en capa_01, donde ya existe un
# contenedor `loki` publicado en :3100 — lo reusamos en vez de desplegar otro.
# Promtail descubre contenedores por el socket de Docker. La rotación json-file
# de docker-compose.prod.yml sigue siendo la red de seguridad en disco si Loki
# está inalcanzable.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.4.6.20:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*promtail.*|.*-db-.*|.*-postgres-.*|.*pgbouncer.*)'
        action: drop

      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

    pipeline_stages:
      - json:
          expressions:
            level:
            component:
            requestId:

      - labels:
          level:
