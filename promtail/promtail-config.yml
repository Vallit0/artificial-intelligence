# ============================================
# Promtail — ships Docker container logs to Loki at 10.4.6.20:3100
# ============================================
#
# Uses docker_sd_configs so Promtail discovers containers via the Docker
# socket and streams their logs (no file tailing needed). The local
# json-file rotation configured in docker-compose.yml still applies as a
# disk-side safety net if Loki is unreachable.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.4.6.20:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      # Skip Promtail's own logs (avoid feedback loop) and Postgres (noisy,
      # application errors surface via the app container through Prisma).
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*promtail.*|.*-db-.*|.*-postgres-.*)'
        action: drop

      # Full container name as a label (e.g., senoriales-48152aa7-app-1).
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # stdout vs stderr.
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

      # Compose service name (app, nginx, ...) — stable across restarts.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

    pipeline_stages:
      # Parse pino JSON lines from the app container. Non-JSON lines (nginx
      # access/error logs) pass through untouched — the json stage silently
      # no-ops when parsing fails.
      - json:
          expressions:
            level:
            component:
            requestId:

      # Promote only low-cardinality fields to labels. `requestId` stays in
      # the log body (high cardinality would blow up Loki's index).
      - labels:
          level:
