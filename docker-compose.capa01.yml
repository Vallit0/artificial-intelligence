# =============================================================================
# DEPLOY CAPA_01 (12 vCPU / 30 GB) — consolidación futura detrás del nginx del
# HOST, caja compartida con los 3 Moodles + n8n. NO es el deploy activo: hoy
# producción corre en capa_02 con docker-compose.prod.yml. Este archivo se
# conserva como artefacto de la migración a capa_01 (ver infra/RUNBOOK.md y la
# memoria golive_scaling_900). 4 réplicas en 127.0.0.1:4001-4004, PgBouncer,
# worker de crons y Postgres a shared_buffers=4GB (acotado para caja compartida).
# =============================================================================

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: senoriales-app:latest
  env_file:
    - ./server/.env
  environment: &app-env
    NODE_ENV: production
    PORT: "3000"
    DATABASE_URL: "postgresql://senoriales:${POSTGRES_PASSWORD}@pgbouncer:6432/senoriales?pgbouncer=true&connection_limit=15&pool_timeout=30"
    CORS_ORIGIN: "https://centro-de-negocios.org,https://www.centro-de-negocios.org"
    JWT_SECRET: "${JWT_SECRET}"
    RUN_CRONS: "false"
  depends_on:
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_started
  restart: unless-stopped
  networks:
    - senoriales-network
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: senoriales-app:latest
    command: sh -c "npx prisma migrate deploy && tsx prisma/seed.ts"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://senoriales:${POSTGRES_PASSWORD}@db:5432/senoriales"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - senoriales-network
    logging: *default-logging

  app1:
    <<: *app-base
    ports:
      - "127.0.0.1:4001:3000"
  app2:
    <<: *app-base
    ports:
      - "127.0.0.1:4002:3000"
  app3:
    <<: *app-base
    ports:
      - "127.0.0.1:4003:3000"
  app4:
    <<: *app-base
    ports:
      - "127.0.0.1:4004:3000"

  worker:
    <<: *app-base
    environment:
      <<: *app-env
      RUN_CRONS: "true"

  db:
    image: postgres:15-alpine
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: senoriales
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: senoriales
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senoriales -d senoriales"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - senoriales-network
    logging: *default-logging

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: senoriales
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_NAME: senoriales
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      AUTH_TYPE: scram-sha-256
      SERVER_IDLE_TIMEOUT: "600"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - senoriales-network
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.3.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.prod.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
    restart: unless-stopped
    networks:
      - senoriales-network
    logging: *default-logging

volumes:
  postgres_data:
  promtail_positions:

networks:
  senoriales-network:
    driver: bridge
