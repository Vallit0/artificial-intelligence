site_name:  Documentación
site_description: Plataforma de entrenamiento de ventas con IA conversacional.
docs_dir: docs
# Rutas planas (page.html en vez de page/) — predecibles para enlazar
# artefactos estáticos como api-reference.html y openapi.json.
use_directory_urls: false

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md
  - Arquitectura:
      - Stack tecnológico: stack.md
      - Manual técnico: MANUAL-TECNICO.md
      - Multi-sede (aislamiento): multi-sede.md
      - Integraciones externas: integraciones.md
  - API:
      - Referencia OpenAPI: api.md
  - Testing: testing.md
  - Operación:
      - Despliegue: deployment.md
      - Docker y contenedores: docker.md
      - Runbooks: RUNBOOKS.md
      - Continuidad (BCP): BCP.md
