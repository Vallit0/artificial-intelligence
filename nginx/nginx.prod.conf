# =============================================================================
# nginx de PRODUCCIÓN — capa_01 (12 vCPU / 32 GiB). Termina TLS y balancea entre
# las 6 réplicas (app1..app6) que docker-compose.prod.yml expone en la red interna
# de Docker. Dimensionado para el Go-Live de 900 asesores (~450 concurrentes).
# (El nginx.conf "plano" de al lado lo usa el docker-compose.yml de un solo app.)
# =============================================================================

# Un worker por core (los 12 vCPU) en vez del default de 1 — destraba el borde
# para sostener cientos de conexiones concurrentes.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/sdp;

    # Rate limiting por IP real del cliente (nginx es el borde, ve la IP real).
    # api: 100r/s — un admin abriendo el dashboard dispara ~6 requests en <1s.
    # auth: 5r/s restrictivo a propósito (credential stuffing).
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;

    # Log con la réplica (upstream) que atendió cada request — sirve para
    # verificar el balanceo y depurar. Va a stdout → `docker compose logs nginx`.
    log_format lb '$remote_addr "$request" $status up=$upstream_addr ${request_time}s';
    access_log /dev/stdout lb;

    # Las 6 réplicas, alcanzadas por nombre de servicio en la red de Docker.
    # least_conn reparte mejor bajo latencias variables; keepalive reusa
    # conexiones upstream y baja latencia en ráfaga.
    upstream app {
        least_conn;
        server app1:3000 max_fails=3 fail_timeout=10s;
        server app2:3000 max_fails=3 fail_timeout=10s;
        server app3:3000 max_fails=3 fail_timeout=10s;
        server app4:3000 max_fails=3 fail_timeout=10s;
        server app5:3000 max_fails=3 fail_timeout=10s;
        server app6:3000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name centro-de-negocios.org www.centro-de-negocios.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name centro-de-negocios.org www.centro-de-negocios.org;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Reusar conexiones keepalive hacia el upstream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Auth routes (rate limiting más estricto)
        location /auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Health check
        location /health {
            proxy_pass http://app;
        }

        # SPA fallback
        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
