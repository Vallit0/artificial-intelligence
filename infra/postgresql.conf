# =============================================================================
# PostgreSQL 15 — tuning para capa_01 (12 vCPU / 30 GB), montado en
# /etc/postgresql/postgresql.conf y arrancado con `-c config_file=...`.
#
# IMPORTANTE: capa_01 es una caja COMPARTIDA — además de este Postgres corren
# 3 Moodles sobre MariaDB, n8n y observabilidad. Por eso NO le damos a Postgres
# el ~25%/75% de RAM que daríamos en una caja dedicada; lo acotamos para
# coexistir (deja >20 GB para MariaDB/Moodle/SO).
#
# Como usamos un config_file fuera de PGDATA, hay que declarar explícitamente
# data_directory y hba_file (lo demás toma defaults razonables).
# =============================================================================

data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'

listen_addresses = '*'
port = 5432
max_connections = 200          # PgBouncer multiplexa; 200 da holgura + réplica + admin

# ---- Memoria (acotada: caja compartida con MariaDB/Moodle) ------------------
shared_buffers = 4GB           # conservador para no competir con MariaDB
effective_cache_size = 12GB    # estimación para el planner (no reserva memoria)
maintenance_work_mem = 512MB
work_mem = 24MB                # por operación de sort/hash; cuidado: ×conexiones
huge_pages = try

# ---- Planner / SSD ----------------------------------------------------------
random_page_cost = 1.1         # almacenamiento SSD
effective_io_concurrency = 200

# ---- WAL / checkpoints / durabilidad ---------------------------------------
wal_level = replica            # habilita streaming replication hacia capa_02
max_wal_senders = 5
wal_keep_size = 1GB            # evita que la réplica pierda WAL si se atrasa
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
synchronous_commit = on        # durabilidad; la réplica es asíncrona (no bloquea)

# ---- Paralelismo ------------------------------------------------------------
max_worker_processes = 12
max_parallel_workers = 12
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 4

# ---- Logging / observabilidad ----------------------------------------------
log_min_duration_statement = 1000   # loguea queries > 1s (detectar lentas)
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %u@%d '

# ---- Autovacuum (más agresivo bajo carga de escritura) ----------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
