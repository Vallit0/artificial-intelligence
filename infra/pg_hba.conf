# =============================================================================
# pg_hba.conf — control de acceso de Postgres (capa_01).
# Montado en /etc/postgresql/pg_hba.conf y referenciado desde postgresql.conf.
#
# TYPE  DATABASE      USER         ADDRESS            METHOD
# =============================================================================

# Conexiones locales dentro del contenedor (socket unix).
local   all           all                             trust

# Loopback.
host    all           all          127.0.0.1/32       scram-sha-256
host    all           all          ::1/128            scram-sha-256

# Red interna de Docker Compose (bridge). PgBouncer y, durante migraciones, el
# job `migrate` entran por aquí. Rango amplio de Docker; el secreto real es la
# contraseña scram, no la IP.
host    all           all          172.16.0.0/12      scram-sha-256

# Réplica en caliente en capa_02 (red privada 10.4.6.x). El usuario `replicator`
# debe existir con LOGIN REPLICATION (ver infra/RUNBOOK.md). Restringido a la
# subred privada — nunca exponer replicación a IP pública.
host    replication   replicator   10.4.6.0/24        scram-sha-256
host    all           replicator   10.4.6.0/24        scram-sha-256
