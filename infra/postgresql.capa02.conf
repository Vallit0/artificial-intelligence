# =============================================================================
# PostgreSQL 15 — tuning para capa_02 (4 vCPU / 8 GiB, caja DEDICADA a Señoriales).
# Montado en /etc/postgresql/postgresql.conf y arrancado con `-c config_file=...`.
#
# A diferencia de infra/postgresql.conf (capa_01, caja COMPARTIDA con Moodles),
# aquí la caja es dedicada, así que damos a Postgres el ~25% de RAM en
# shared_buffers y ~60% en effective_cache_size, dejando margen para 2 réplicas
# Node (~1.5 GB) + nginx + SO.
#
# Como usamos un config_file fuera de PGDATA, declaramos explícitamente
# data_directory y hba_file.
# =============================================================================

data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'

listen_addresses = '*'
port = 5432
max_connections = 100          # 2 réplicas × connection_limit=20 = 40; resto para admin/réplica futura

# ---- Memoria (caja dedicada de 8 GiB) ---------------------------------------
shared_buffers = 2GB           # ~25% de RAM
effective_cache_size = 5GB     # estimación para el planner (no reserva memoria)
maintenance_work_mem = 256MB
work_mem = 16MB                # por operación de sort/hash; ×conexiones (≤100)
huge_pages = try

# ---- Planner / SSD ----------------------------------------------------------
random_page_cost = 1.1         # almacenamiento SSD
effective_io_concurrency = 200

# ---- WAL / checkpoints / durabilidad ---------------------------------------
wal_level = replica            # deja habilitada una réplica streaming futura
max_wal_senders = 3
wal_keep_size = 512MB
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
synchronous_commit = on

# ---- Paralelismo (4 vCPU) ---------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---- Logging / observabilidad ----------------------------------------------
log_min_duration_statement = 1000   # loguea queries > 1s (detectar lentas)
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %u@%d '

# ---- Autovacuum (más agresivo bajo carga de escritura) ----------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
