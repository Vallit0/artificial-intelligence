# =============================================================================
# Vhost de Señoriales para el NGINX DEL HOST en capa_01.
#   → /etc/nginx/sites-available/centro-de-negocios.org.conf
#   → ln -s ../sites-available/centro-de-negocios.org.conf /etc/nginx/sites-enabled/
#
# Este archivo es HTTP-only a propósito. Tras habilitarlo, corre:
#   certbot --nginx -d centro-de-negocios.org -d www.centro-de-negocios.org
# Certbot agrega automáticamente el server{} de 443 con los certs y el redirect
# 80→443 (mismo patrón que ya usan los vhosts de Moodle en esta caja).
#
# Depende de /etc/nginx/conf.d/10-senoriales-upstream.conf (upstream + zonas).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name centro-de-negocios.org www.centro-de-negocios.org;

    client_max_body_size 10M;

    # Compresión (por si el http{} del host no la trae globalmente).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/sdp;

    # Cabeceras de proxy + keepalive hacia el upstream.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cabeceras de seguridad.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Auth — rate-limit estricto (credential stuffing).
    location /auth/ {
        limit_req zone=sen_auth burst=10 nodelay;
        proxy_pass http://senoriales;
    }

    # API.
    location /api/ {
        limit_req zone=sen_api burst=300 nodelay;
        proxy_pass http://senoriales;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # LTI (lanzamientos firmados desde Moodle — sin rate-limit).
    location /lti/ {
        proxy_pass http://senoriales;
    }

    location /health {
        proxy_pass http://senoriales;
        access_log off;
    }

    # SPA + estáticos.
    location / {
        proxy_pass http://senoriales;
    }
}
