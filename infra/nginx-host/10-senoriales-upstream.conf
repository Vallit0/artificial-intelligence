# =============================================================================
# Va en /etc/nginx/conf.d/10-senoriales-upstream.conf  (ámbito http del host).
# Define el upstream a las 4 réplicas (loopback) y las zonas de rate-limit.
# conf.d se incluye DENTRO de http{}, que es donde deben vivir estas directivas.
# =============================================================================

# Las 4 réplicas de Señoriales, publicadas por docker-compose.prod.yml en
# 127.0.0.1:4001..4004. least_conn reparte mejor bajo latencias variables;
# keepalive reusa conexiones y baja latencia en ráfaga.
upstream senoriales {
    least_conn;
    server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4004 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Rate-limit por IP (no había ninguna definida en el host, sin choque de nombres).
limit_req_zone $binary_remote_addr zone=sen_api:10m  rate=100r/s;
limit_req_zone $binary_remote_addr zone=sen_auth:10m rate=5r/s;
