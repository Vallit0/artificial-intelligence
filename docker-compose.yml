version: '3.8'

services:
  # ============================================
  # Aplicación Principal (Frontend + Backend)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      # connection_limit=20: el default de Prisma es 10, que satura con
      # ~20 requests concurrentes y dispara errores P2024 ("timed out fetching
      # a new connection from the pool"). 20 es seguro dentro del max_connections
      # default de Postgres 15 (100).
      - DATABASE_URL=postgresql://senoriales:senoriales@db:5432/senoriales?connection_limit=20&pool_timeout=30
      - CORS_ORIGIN=https://centro-de-negocios.org,https://www.centro-de-negocios.org,http://localhost,http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-senoriales-dev-secret-change-in-prod}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - senoriales-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Base de Datos PostgreSQL
  # ============================================
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=senoriales
      - POSTGRES_PASSWORD=senoriales
      - POSTGRES_DB=senoriales
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # Only expose in development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senoriales -d senoriales"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - senoriales-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - senoriales-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Promtail — ships container logs to Loki at 10.4.6.20:3100
  # ============================================
  promtail:
    image: grafana/promtail:3.3.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
    restart: unless-stopped
    networks:
      - senoriales-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  promtail_positions:

networks:
  senoriales-network:
    driver: bridge
